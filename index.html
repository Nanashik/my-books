<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WNanashiのHP</title>
    <style>
        body { font-family: sans-serif; max-width: 650px; margin: 40px auto; padding: 0 20px; color: #333; line-height: 1.6; }
        h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
        .nav-btn { display: inline-block; margin: 10px 0 25px 0; padding: 10px 18px; background: #007bff; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
        .nav-btn:hover { background: #0056b3; }
        .article-card { border-bottom: 1px solid #eee; padding: 12px 0; display: flex; justify-content: space-between; align-items: center; }
        .file-name { font-weight: bold; font-size: 16px; word-break: break-all; }
        .file-link { text-decoration: none; color: #007bff; background: #e9ecef; padding: 6px 12px; border-radius: 4px; font-size: 14px; font-weight: bold; white-space: nowrap; margin-left: 10px; }
        .file-link:hover { background: #dee2e6; }
        .loading { color: #888; font-style: italic; }
    </style>
</head>
<body>

    <h1>書いたもの一覧</h1>

    <!-- 前回作った読書管理ページへのリンク -->
    <a href="books.html" class="nav-btn">📚 読書管理リストを見る →</a>

    <h2>📁 Article フォルダ内のドキュメント</h2>
    <div id="article-list" class="loading">フォルダを読み込んでいます...</div>

    <script>
        const USERNAME = 'Nanashik'; 
        const REPO = 'my-books'; 
        const FOLDER_PATH = 'Article';

        async function fetchArticles() {
            const listContainer = document.getElementById('article-list');
            const apiUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${FOLDER_PATH}`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error('Article フォルダが見つからないか、読み込めませんでした。');
                }
                const files = await response.json();

                // .pdf または .tex ファイルだけを自動抽出
                const targetFiles = files.filter(file => 
                    file.type === 'file' && (file.name.endsWith('.pdf') || file.name.endsWith('.tex'))
                );

                if (targetFiles.length === 0) {
                    listContainer.className = '';
                    listContainer.innerHTML = '<p style="color: #888;">Article フォルダ内に .pdf または .tex ファイルがありません。</p>';
                    return;
                }

                let html = '';
                targetFiles.forEach(file => {
                    const relativePath = `./${FOLDER_PATH}/${file.name}`;
                    
                    html += `
                        <div class="article-card">
                            <span class="file-name">${file.name}</span>
                            <a href="${relativePath}" target="_blank" class="file-link">表示 ↗</a>
                        </div>
                    `;
                });

                listContainer.className = '';
                listContainer.innerHTML = html;

            } catch (error) {
                listContainer.className = '';
                listContainer.innerHTML = `<p style="color: red;">エラー: ${error.message}</p>`;
            }
        }

        fetchArticles();
    </script>
</body>
</html>
