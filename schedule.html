<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>週間時間割 & 読書管理</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif;
    }

    body {
      margin: 0;
      padding: 24px;
      background-color: #ffffff;
      color: #333333;
    }

    /* 上部ナビゲーションバー */
    .top-nav {
      max-width: 1250px;
      margin: 0 auto 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-link {
      color: #1f5a7d;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .container {
      display: flex;
      gap: 32px;
      max-width: 1250px;
      margin: 0 auto;
      align-items: flex-start;
    }

    /* --- 左側：時間割テーブル --- */
    .schedule-container {
      flex: 3.2;
    }

    table.schedule-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    table.schedule-table th, 
    table.schedule-table td {
      border: 1.5px solid #ffffff;
      text-align: center;
      vertical-align: middle;
      padding: 0;
    }

    table.schedule-table th {
      background-color: #1f5a7d;
      color: #ffffff;
      font-weight: bold;
      padding: 10px 4px;
      font-size: 15px;
    }

    table.schedule-table td.time-col {
      background-color: #d1dbe4; 
      color: #222222;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 4px;
      width: 110px;
      white-space: nowrap;
    }

    table.schedule-table td.cell {
      background-color: #eef2f5;
      height: 52px;
    }

    table.schedule-table td.cell textarea {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      resize: none;
      padding: 6px;
      font-size: 12px;
      line-height: 1.3;
      color: #222222;
      outline: none;
      text-align: center;
      box-sizing: border-box;
    }

    /* --- 右側：読書ノート --- */
    .sidebar {
      flex: 1.4;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 320px;
      padding-top: 4px;
    }

    .section-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-title {
      font-size: 14px;
      font-weight: bold;
      color: #222222;
    }

    .add-btn {
      padding: 3px 8px;
      font-size: 12px;
      background-color: #1f5a7d;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .add-btn:hover {
      background-color: #143d56;
    }

    .arrow-down {
      font-size: 16px;
      color: #333333;
      margin: -4px 0 0 0;
    }

    /* 本のリストと入力項目デザイン */
    .book-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .empty-msg {
      font-size: 12px;
      color: #888;
      font-style: italic;
      padding: 4px 0;
    }

    .book-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
    }

    /* 番号（ラベル）用スタイル */
    .bullet {
      font-weight: bold;
      color: #1f5a7d;
      min-width: 18px;
      font-size: 13px;
    }

    .input-title {
      flex: 1;
      min-width: 0;
      border: 1px solid #ccc;
      border-radius: 3px;
      padding: 4px 6px;
      font-size: 12px;
      outline: none;
    }

    .input-title:focus, .input-page:focus {
      border-color: #1f5a7d;
    }

    .book-title-label {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px;
      color: #222;
    }

    /* 数値入力エリアの上下矢印を隠す */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    .input-page {
      width: 48px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 3px;
      padding: 4px 2px;
      font-size: 12px;
      outline: none;
    }

    .paren, .slash, .unit {
      color: #555;
      font-size: 12px;
      white-space: nowrap;
    }

    .btn-del {
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
      line-height: 1;
    }

    .btn-del:hover {
      color: #d9534f;
    }

    /* ボタンエリア */
    .controls {
      max-width: 1250px;
      margin: 16px auto 0;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      padding: 6px 14px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #f8f9fa;
      cursor: pointer;
      color: #333;
    }

    .btn:hover {
      background-color: #e9ecef;
    }
  </style>
</head>
<body>

  <!-- トップへ戻るナビゲーション -->
  <div class="top-nav">
    <a href="index.html" class="back-link">← トップへ戻る</a>
  </div>

  <div class="container">
    <!-- 左側：時間割 -->
    <div class="schedule-container">
      <table class="schedule-table">
        <thead>
          <tr>
            <th style="width: 110px;"></th>
            <th>月</th>
            <th>火</th>
            <th>水</th>
            <th>木</th>
            <th>金</th>
            <th>土</th>
            <th>日</th>
          </tr>
        </thead>
        <tbody>
          <script>
            const timeSlots = [
              "5:00-6:00",
              "6:15-7:15",
              "7:30-8:30",
              "8:45-10:15",
              "10:30-12:00",
              "13:00-14:30",
              "14:45-16:15",
              "16:30-18:00",
              "19:00-20:00"
            ];

            timeSlots.forEach((time, rowIndex) => {
              document.write(`
                <tr>
                  <td class="time-col">${time}</td>
                  ${[0, 1, 2, 3, 4, 5, 6].map(colIndex => `
                    <td class="cell">
                      <textarea id="cell-${rowIndex}-${colIndex}" class="save-input"></textarea>
                    </td>
                  `).join('')}
                </tr>
              `);
            });
          </script>
        </tbody>
      </table>
    </div>

    <!-- 右側：読書管理 -->
    <div class="sidebar">
      <!-- 今読んでいる本 -->
      <div class="section-block">
        <div class="section-header">
          <div class="section-title">今読んでいる本</div>
          <button type="button" class="add-btn" onclick="addBook()">+ 本を追加</button>
        </div>
        <div id="reading-now-list" class="book-list"></div>
      </div>

      <div class="arrow-down">↓</div>

      <!-- 今週の目標 -->
      <div class="section-block">
        <div class="section-title">今週の目標</div>
        <div id="weekly-goals-list" class="book-list"></div>
      </div>

      <!-- 今週の結果 -->
      <div class="section-block">
        <div class="section-title">今週の結果</div>
        <div id="weekly-results-list" class="book-list"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" onclick="clearAllData()">すべての入力をクリア</button>
  </div>

  <script>
    const STORAGE_KEY = 'schedule_app_data_v2';
    let books = [];

    // --- 本の管理機能 ---
    function addBook() {
      const newBook = {
        id: 'book_' + Date.now(),
        title: '',
        current: '',
        total: '',
        goal: '',
        result: ''
      };
      books.push(newBook);
      renderBooks();
      saveData();
    }

    function removeBook(id) {
      books = books.filter(b => b.id !== id);
      renderBooks();
      saveData();
    }

    function updateBook(id, field, value) {
      const book = books.find(b => b.id === id);
      if (book) {
        book[field] = value;
        if (field === 'title') {
          const goalTitleEl = document.getElementById(`goal-title-${id}`);
          const resultTitleEl = document.getElementById(`result-title-${id}`);
          const displayTitle = value.trim() ? value : '（タイトル未入力）';
          if (goalTitleEl) goalTitleEl.textContent = displayTitle;
          if (resultTitleEl) resultTitleEl.textContent = displayTitle;
        }
        saveData();
      }
    }

    function renderBooks() {
      const nowList = document.getElementById('reading-now-list');
      const goalList = document.getElementById('weekly-goals-list');
      const resultList = document.getElementById('weekly-results-list');

      if (!nowList || !goalList || !resultList) return;

      nowList.innerHTML = '';
      goalList.innerHTML = '';
      resultList.innerHTML = '';

      if (books.length === 0) {
        nowList.innerHTML = '<div class="empty-msg">「+ 本を追加」を押して追加</div>';
        goalList.innerHTML = '<div class="empty-msg">本が未登録です</div>';
        resultList.innerHTML = '<div class="empty-msg">本が未登録です</div>';
        return;
      }

      books.forEach((book, index) => {
        const displayTitle = book.title.trim() ? book.title : '（タイトル未入力）';
        const labelNumber = `${index + 1}.`;

        // 1. 今読んでいる本
        const nowRow = document.createElement('div');
        nowRow.className = 'book-item';
        nowRow.innerHTML = `
          <span class="bullet">${labelNumber}</span>
          <input type="text" class="input-title" placeholder="本のタイトル" value="${escapeHtml(book.title)}" oninput="updateBook('${book.id}', 'title', this.value)">
          <span class="paren">(</span>
          <input type="number" class="input-page" placeholder="既読" value="${escapeHtml(book.current)}" oninput="updateBook('${book.id}', 'current', this.value)">
          <span class="slash">/</span>
          <input type="number" class="input-page" placeholder="全体" value="${escapeHtml(book.total)}" oninput="updateBook('${book.id}', 'total', this.value)">
          <span class="paren">)</span>
          <button type="button" class="btn-del" title="削除" onclick="removeBook('${book.id}')">×</button>
        `;
        nowList.appendChild(nowRow);

        // 2. 今週の目標
        const goalRow = document.createElement('div');
        goalRow.className = 'book-item';
        goalRow.innerHTML = `
          <span class="bullet">${labelNumber}</span>
          <span id="goal-title-${book.id}" class="book-title-label">${escapeHtml(displayTitle)}</span>
          <span class="paren">(</span>
          <input type="number" class="input-page" placeholder="目標" value="${escapeHtml(book.goal)}" oninput="updateBook('${book.id}', 'goal', this.value)">
          <span class="unit">ページまで)</span>
        `;
        goalList.appendChild(goalRow);

        // 3. 今週の結果
        const resultRow = document.createElement('div');
        resultRow.className = 'book-item';
        resultRow.innerHTML = `
          <span class="bullet">${labelNumber}</span>
          <span id="result-title-${book.id}" class="book-title-label">${escapeHtml(displayTitle)}</span>
          <span class="paren">(</span>
          <input type="number" class="input-page" placeholder="結果" value="${escapeHtml(book.result)}" oninput="updateBook('${book.id}', 'result', this.value)">
          <span class="unit">ページまで)</span>
        `;
        resultList.appendChild(resultRow);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // --- 自動保存 & 復元機能 ---
    function saveData() {
      const scheduleData = {};
      document.querySelectorAll('.save-input').forEach(input => {
        scheduleData[input.id] = input.value;
      });

      const payload = {
        schedule: scheduleData,
        books: books
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    }

    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return;
      try {
        const payload = JSON.parse(saved);
        if (payload.schedule) {
          Object.keys(payload.schedule).forEach(id => {
            const el = document.getElementById(id);
            if (el) el.value = payload.schedule[id];
          });
        }
        if (Array.isArray(payload.books)) {
          books = payload.books;
          renderBooks();
        }
      } catch (e) {
        console.error('データの復元に失敗しました', e);
      }
    }

    function clearAllData() {
      if (confirm('すべての入力内容（時間割・読書ノート）をクリアしますか？')) {
        localStorage.removeItem(STORAGE_KEY);
        document.querySelectorAll('.save-input').forEach(input => input.value = '');
        books = [];
        renderBooks();
      }
    }

    // イベント設定
    document.addEventListener('DOMContentLoaded', () => {
      loadData();
      if (books.length === 0) {
        renderBooks();
      }
      document.querySelectorAll('.save-input').forEach(input => {
        input.addEventListener('input', saveData);
      });
    });
  </script>

</body>
</html>
